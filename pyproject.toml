[project]
name = "oauth2client"
version = "0.1.0"
description = "Importable OAuth2 client with an mkcert-secured local callback server. Works with Google, Microsoft, D2L Brightspace, and any standard OAuth2 provider."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
oauth2 = "oauth2client.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "trustme>=1.1",
]
